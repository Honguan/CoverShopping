name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: laravel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    steps:
      - name: Validate Issue branch and PR references
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^issue/([0-9]+)-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Branch must match issue/<issue-number>-<short-description>."
            exit 1
          fi

          issue_number="${BASH_REMATCH[1]}"

          if [[ ! "$PR_TITLE" =~ \#${issue_number}([^0-9]|$) ]]; then
            echo "PR title must contain #${issue_number}."
            exit 1
          fi

          if ! grep -Eiq "(^|[[:space:]])Refs[[:space:]]+#${issue_number}([^0-9]|$)" <<< "$PR_BODY"; then
            echo "PR body must contain Refs #${issue_number}."
            exit 1
          fi

          if grep -Eiq "(Fixes|Closes|Resolves)[[:space:]]+#${issue_number}([^0-9]|$)" <<< "$PR_BODY"; then
            echo "Do not close the Issue before main verification. Use Refs #${issue_number}."
            exit 1
          fi

          state="$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          if [[ "$state" != "OPEN" ]]; then
            echo "Issue #${issue_number} must exist and remain open until main verification."
            exit 1
          fi

      - name: Skip metadata validation outside pull requests
        if: github.event_name != 'pull_request'
        run: echo "PR metadata validation is not required for this event."

  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: covershopping_test
          MYSQL_USER: covershopping
          MYSQL_PASSWORD: covershopping
          MYSQL_ROOT_PASSWORD: covershopping-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pcovershopping-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_USERNAME: covershopping
      DB_PASSWORD: covershopping
      MYSQL_ROOT_PASSWORD: covershopping-root

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, sqlite, bcmath
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Check changed PHP formatting
        run: vendor/bin/pint --test --diff=HEAD^
      - run: npm run build
      - run: composer analyse
      - run: composer test
      - name: Run MySQL integration and concurrency tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: covershopping_test
        run: php artisan test tests/Feature/MySqlCartConcurrencyTest.php
      - run: git diff --check
      - run: docker compose up --detach --build
      - run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/live; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live || {
            docker compose ps
            docker compose logs app
            exit 1
          }
          if curl --fail --silent http://127.0.0.1:8080/health/ready; then
            echo "Readiness unexpectedly succeeded before migrations."
            exit 1
          fi
          docker compose exec -T app php artisan migrate --force
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready || {
            docker compose ps
            docker compose logs app
            exit 1
          }
          docker compose exec -T app test -L public/storage
          docker compose exec -T --user www-data app sh -c 'printf storage-ok > storage/app/public/ci-storage-check.txt'
          curl --fail --silent --show-error http://127.0.0.1:8080/storage/ci-storage-check.txt | grep --fixed-strings storage-ok
          docker compose up --detach --no-deps --force-recreate app
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready; then
              curl --fail --silent --show-error http://127.0.0.1:8080/storage/ci-storage-check.txt | grep --fixed-strings storage-ok
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs app
          exit 1
      - if: always()
        run: docker compose down --volumes --remove-orphans
