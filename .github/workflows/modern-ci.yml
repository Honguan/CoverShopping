name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: laravel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    name: PR metadata
    runs-on: ubuntu-latest
    steps:
      - name: No PR metadata rules
        run: echo "PR metadata validation is disabled."

  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: covershopping_test
          MYSQL_USER: covershopping
          MYSQL_PASSWORD: covershopping
          MYSQL_ROOT_PASSWORD: covershopping-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --protocol=TCP -h127.0.0.1 -ucovershopping -pcovershopping covershopping_test --execute='SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_USERNAME: covershopping
      DB_PASSWORD: covershopping
      MYSQL_ROOT_PASSWORD: covershopping-root

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, sqlite, bcmath
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Audit frontend build dependencies
        run: npm audit --audit-level=high
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: Check changed PHP formatting
        run: vendor/bin/pint --test --diff=HEAD^
      - run: npm run build
      - run: composer analyse
      - run: composer test
      - name: Run MySQL integration and concurrency tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: covershopping_test
        run: php artisan test tests/Feature/MySqlCartConcurrencyTest.php
      - run: git diff --check
      - name: Verify MySQL readiness during initialization
        run: python3 tests/Support/mysql_healthcheck.py
      - run: docker compose up --detach --build
      - run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/live; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health/live || {
            docker compose ps
            docker compose logs app
            exit 1
          }
          if curl --fail --silent http://127.0.0.1:8080/health/ready; then
            echo "Readiness unexpectedly succeeded before migrations."
            exit 1
          fi
          docker compose exec -T app php artisan migrate --force
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready || {
            docker compose ps
            docker compose logs app
            exit 1
          }
          docker compose exec -T scheduler php artisan schedule:list | grep --fixed-strings shopping:prune-guest-data
          test "$(docker compose ps --status running --services | grep --line-regexp --count scheduler)" = 1
          docker compose exec -T app test -L public/storage
          docker compose exec -T --user www-data app sh -c 'printf storage-ok > storage/app/public/ci-storage-check.txt'
          curl --fail --silent --show-error http://127.0.0.1:8080/storage/ci-storage-check.txt | grep --fixed-strings storage-ok
          docker compose up --detach --no-deps --force-recreate app
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health/ready; then
              curl --fail --silent --show-error http://127.0.0.1:8080/storage/ci-storage-check.txt | grep --fixed-strings storage-ok
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs app
          exit 1
      - if: always()
        run: docker compose down --volumes --remove-orphans
