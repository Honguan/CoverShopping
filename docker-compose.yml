services:
  app:
    build: .
    environment: &app-environment
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: ${APP_URL:-http://localhost:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-covershopping}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_SECURE_COOKIE: "true"
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-CoverShopping}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-manual}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-twd}
      ECPAY_MERCHANT_ID: ${ECPAY_MERCHANT_ID:-}
      ECPAY_HASH_KEY: ${ECPAY_HASH_KEY:-}
      ECPAY_HASH_IV: ${ECPAY_HASH_IV:-}
      ECPAY_MODE: ${ECPAY_MODE:-stage}
    ports:
      - "${APP_PORT:-127.0.0.1:8080}:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit((int) ! @file_get_contents('http://127.0.0.1/health/ready'));\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    volumes:
      - uploads:/var/www/html/storage/app/public

  # 排程不依賴 app 的 readiness：migration 在 app 啟動後才由單一工作程序執行。
  # 以 www-data 執行，避免在共用的 storage 建立 root 擁有的檔案。
  scheduler:
    build: .
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "exec php artisan schedule:work"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 訂單通知信等佇列工作；與 scheduler 相同以 www-data 執行。
  queue:
    build: .
    command: ["su", "-s", "/bin/sh", "www-data", "-c", "exec php artisan queue:work --tries=3 --backoff=60"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-covershopping}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$${MYSQL_USER}\" --database=\"$${MYSQL_DATABASE}\" --execute='SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - database:/var/lib/mysql

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - redis:/data

volumes:
  database:
  redis:
  uploads:
